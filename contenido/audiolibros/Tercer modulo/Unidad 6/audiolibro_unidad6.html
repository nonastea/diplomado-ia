<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Perspectivas futuras y aplicaciones emergentes</title>
<style>
  :root{
    --bg:#FBFAF6; --card:#FFFFFF; --card2:#F1EEE5;
    --ink:#1C2723; --soft:#5C645E; --green:#0F8A6E; --green-deep:#0B6A55;
    --amber:#C2772C; --line:#E5E1D6; --hl:#DEF1EA; --done:#AEB6AF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Avenir Next','Avenir',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:18px;line-height:1.62;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto;background:var(--bg);}

  /* HEADER */
  header{padding:16px 20px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;}
  .eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--green);margin:0 0 4px;}
  header h1{font-size:1.12rem;font-weight:800;margin:0;line-height:1.25;letter-spacing:-.2px;color:var(--ink);}

  /* TEXTO */
  #reader{flex:1 1 auto;overflow-y:auto;padding:18px 20px 210px;-webkit-overflow-scrolling:touch;}
  .seg{margin:0 0 14px;color:var(--soft);transition:color .25s,background .25s;padding:3px 10px;border-radius:9px;cursor:pointer;scroll-margin-top:20px;}
  .seg.chap{color:var(--ink);font-weight:800;font-size:1.2rem;margin:26px 0 12px;line-height:1.28;}
  .seg.active{color:var(--ink);background:var(--hl);}
  .seg.chap.active{background:var(--hl);}
  .seg.done{color:var(--done);}

  /* CONTROLES */
  .bar{
    position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;
    background:linear-gradient(180deg,rgba(251,250,246,0) 0%,var(--bg) 24%);
    padding:14px 18px calc(16px + env(safe-area-inset-bottom));
  }
  .progress{height:5px;background:var(--card2);border-radius:4px;overflow:hidden;margin:0 2px 12px;}
  .progress i{display:block;height:100%;width:0;background:var(--green);transition:width .3s;}
  .ctrls{display:flex;align-items:center;justify-content:center;gap:14px;}
  button{font-family:inherit;color:var(--ink);border:none;background:var(--card);border-radius:14px;cursor:pointer;}
  .btn-skip{width:56px;height:56px;font-size:.78rem;font-weight:700;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid var(--line);color:var(--soft);}
  .btn-skip span{font-size:1.15rem;color:var(--ink);}
  .btn-play{width:74px;height:74px;border-radius:50%;background:var(--green);color:#fff;font-size:2rem;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(15,138,110,.30);border:none;}
  .btn-play:active{transform:scale(.94);}
  .row2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;}
  .pill{background:var(--card);border-radius:12px;padding:9px 12px;font-size:.86rem;color:var(--soft);display:flex;align-items:center;gap:8px;font-weight:600;border:1px solid var(--line);}
  .pill b{color:var(--ink);}
  select{font-family:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:.86rem;font-weight:600;max-width:46vw;}
  .spd{display:flex;gap:6px;}
  .spd button{padding:8px 11px;font-size:.82rem;font-weight:700;background:var(--card);color:var(--soft);border-radius:10px;border:1px solid var(--line);}
  .spd button.on{background:var(--green);color:#fff;border-color:var(--green);}

  /* SHEET capitulos */
  #chapBtn{background:var(--card);border-radius:12px;padding:9px 14px;font-size:.86rem;font-weight:700;color:var(--ink);border:1px solid var(--line);}
  .sheet{position:fixed;inset:0;background:rgba(28,39,35,.45);display:none;z-index:20;}
  .sheet.open{display:block;}
  .sheet-inner{position:absolute;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;max-height:72dvh;overflow-y:auto;padding:10px 0 24px;box-shadow:0 -8px 30px rgba(28,39,35,.14);}
  .sheet-inner h3{margin:14px 22px;font-size:.78rem;text-transform:uppercase;letter-spacing:.6px;color:var(--soft);}
  .chap-item{padding:14px 22px;font-weight:600;border-top:1px solid var(--line);cursor:pointer;color:var(--ink);}
  .chap-item:active{background:var(--hl);}
  .chap-item .cn{color:var(--green);font-weight:800;margin-right:10px;}

  /* TOAST (aviso de "retomando") */
  .toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-12px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:.85rem;font-weight:600;opacity:0;transition:opacity .35s,transform .35s;z-index:40;box-shadow:0 6px 20px rgba(28,39,35,.25);pointer-events:none;max-width:86vw;text-align:center;}
  .toast.show{opacity:.96;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <p class="eyebrow">Audiolibro &middot; Unidad 6 &middot; voz del dispositivo</p>
    <h1>Perspectivas futuras y aplicaciones emergentes</h1>
  </header>
  <div id="reader"></div>
</div>

<div class="bar">
  <div class="progress"><i id="pfill"></i></div>
  <div class="ctrls">
    <button class="btn-skip" id="prev"><span>&#9664;</span>Anterior</button>
    <button class="btn-play" id="play">&#9658;</button>
    <button class="btn-skip" id="next">Siguiente<span>&#9654;</span></button>
  </div>
  <div class="row2">
    <button id="chapBtn">&#9776; Capitulos</button>
    <div class="spd">
      <button data-r="0.9">0.9&times;</button>
      <button data-r="1" class="on">1&times;</button>
      <button data-r="1.25">1.25&times;</button>
      <button data-r="1.5">1.5&times;</button>
    </div>
  </div>
  <div class="row2">
    <div class="pill">Voz</div>
    <select id="voice"></select>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <h3>Capitulos</h3>
    <div id="chapList"></div>
  </div>
</div>

<script>
const SEGS = [{"t": "Hola, Jeanette. Bienvenida a la sexta unidad de tu curso. En las unidades anteriores ya aprendiste a hablarle bien a la I.A., a automatizar tareas repetidas y a gobernar sus flujos con criterio. Hoy damos un giro distinto. Miramos hacia adelante.", "c": false}, {"t": "Esta unidad se llama prospectiva tecnológica. Suena a ciencia ficción, pero en la práctica es bastante concreta. Se trata de anticipar escenarios futuros en tecnología para tomar mejores decisiones hoy. No se trata de adivinar el futuro. Se trata de prepararse con tiempo para que, cuando esas herramientas estén disponibles, tu equipo ya sepa qué preguntar, qué pedir y en qué poner el ojo.", "c": false}, {"t": "Vamos a recorrer cinco frentes juntos: I.A. multimodal, Edge Computing, agentes autónomos, Auto M L e I.A. explicable. Cada uno con casos reales, cifras del curso y su traducción directa a tu mundo de afiliados, traspasos y campañas de retención. No necesitas saber de tecnología ni de matemáticas. Aquí solo hay criterio comercial aplicado a la I.A.", "c": false}, {"t": "Capítulo 1. El mapa de lo que viene", "c": true}, {"t": "Antes de entrar en cada tecnología, conviene poner el contexto. El curso trae un dato de fondo: el noventa por ciento de las empresas latinoamericanas planea aumentar su inversión en tecnologías emergentes en los próximos meses. Eso significa que, en los próximos años, vas a recibir propuestas de proveedores que incluirán estas cinco tecnologías. La ventaja no está en ser la primera en comprar. Está en entender qué resolver en cada caso.", "c": false}, {"t": "Hay una advertencia importante con esa cifra del noventa por ciento. Proviene de un estudio de NTT DATA y HBR Analytic Services de mayo de dos mil veintidós, con trescientos dieciséis ejecutivos de seis países. Y se refiere a tecnologías emergentes en general, no solo a I.A. Un dato más reciente, de dos mil veinticinco, ubica en ochenta y seis por ciento a las empresas que explora o implementa I.A. generativa. Para tu planificación, lo relevante es la dirección: la inversión está subiendo, y tu AFP no va a ser la excepción.", "c": false}, {"t": "La unidad tiene un objetivo claro: observar el futuro de la I.A. en los negocios y explorar cinco tecnologías que prometen transformar la forma de crear valor. No se trata de predicciones infalibles. Se trata de identificar direcciones claras para que las empresas latinoamericanas no solo reaccionen ante los cambios, sino que se adelanten a ellos. Al terminar este audio, vas a tener un mapa de lo que viene y criterios para decidir cuándo y cómo adoptarlo en tu área comercial.", "c": false}, {"t": "Cada tecnología la vamos a ver con la misma estructura: qué es, cómo funciona a grandes rasgos, qué aplicaciones de negocio habilita y qué casos reales ya muestran sus beneficios. Siempre con la traducción a tu mundo. A un afiliado que llama con una foto, a un traspaso entre fondos, a una campaña de retención. Eso es lo que te va a servir cuando un proveedor te ofrezca algo nuevo y tengas que decir si tiene sentido o no.", "c": false}, {"t": "Hay dos beneficios principales que vas a obtener. Por un lado, identificar y anticipar: reconocer a tiempo qué tecnologías de I.A. son relevantes para tu negocio y aplicar innovación con impacto medible, no por moda. Por otro, confianza y cumplimiento: cumplir futuras regulaciones de I.A. mediante la explicabilidad y generar confianza en afiliados y en las autoridades. Innovar sin perder de vista la transparencia y la seguridad.", "c": false}, {"t": "Piensa en esta situación: estás en una reunión estratégica y tu gerente de operaciones dice que quiere un agente autónomo que haga retención proactiva con I.A. explicable, usando datos multimodales del call center y Edge en las sucursales. Si has escuchado este audio, sabes exactamente qué está pidiendo en cada palabra. Y si no, probablemente asentirías sin entender por qué el proyecto tardaría seis meses. Dominar el vocabulario no es un lujo técnico. Es lo que te permite participar en decisiones de inversión.", "c": false}, {"t": "Anticipar no es adivinar. Es conocer las cinco tecnologías que vienen, entender qué resuelve cada una en tu negocio y decidir con tiempo cómo prepararse. Esa es la brújula de esta unidad. No necesitas memorizar detalles técnicos. Necesitas criterio para sentarte en cualquier reunión y hablar de I.A. con seguridad.", "c": false}, {"t": "Capítulo 2. I.A. multimodal: cuando la máquina entiende por todos los sentidos", "c": true}, {"t": "Hasta ahora, la mayoría de las herramientas de I.A. con las que has trabajado entienden una sola cosa: texto. Les escribes un mensaje y te devuelven texto. La I.A. multimodal es una evolución significativa. Son sistemas capaces de entender e interactuar con distintos tipos de datos a la vez: texto, imágenes, audio e incluso video. En los negocios, mejora la experiencia del cliente, optimiza la atención y crea productos más inteligentes.", "c": false}, {"t": "¿Cómo funciona a grandes rasgos? Un modelo multimodal aprende a establecer conexiones entre diferentes tipos de datos. Durante su entrenamiento, se le suministran datos combinados: imágenes acompañadas de descripciones textuales, o videos con narración de audio. Esto le permite formar asociaciones, como conectar el símbolo visual de un objeto con la palabra que lo nombra. Una vez entrenado, el modelo puede traducir entre estos diferentes modos de información. Es como imitar la forma en que los humanos usamos varios sentidos a la vez.", "c": false}, {"t": "El ejemplo que da el curso es el sistema multimodal GPT-4 de OpenAI. Puede recibir una foto y generar una explicación escrita de su contenido, o tomar una instrucción hablada y crear una imagen relacionada. En términos prácticos, esto implica asistentes de I.A. mucho más avanzados, que ven y escuchan el mundo, en lugar de limitarse a leer texto. La sinergia entre modalidades busca reproducir nuestra propia manera de entender el entorno.", "c": false}, {"t": "Traducido a tu mundo, imagina esto: un afiliado que llama con una foto de un comprobante de sueldo y pregunta si eso le sirve para acreditar ingreso. Hoy, el operador transcribe y consulta manualmente. Con I.A. multimodal, el sistema leería la imagen y el audio juntos y respondería en una sola interacción. Sin transcripción intermedia. Sin espera. Sin fricción.", "c": false}, {"t": "Otro ejemplo directo para ti: piensa en una campaña de traspaso entre fondos. Hoy, el ejecutivo arma el argumento con datos de rendimiento, que son numéricos, un gráfico, que es imagen, y lo explica por teléfono, que es audio. Con I.A. multimodal, el sistema podría recibir los tres a la vez, cruzarlos y proponer un argumento personalizado para cada perfil de afiliado. En lugar de un guion genérico para todos, cada afiliado recibiría un mensaje calibrado a su situación.", "c": false}, {"t": "El curso presenta tres casos de aplicación. El primero es Hering, una empresa de retail en Brasil, que implementó un buscador de productos basado en imágenes más un chatbot avanzado. El cliente sube una foto de una prenda y la I.A. reconoce el producto o uno similar. La tasa de clics aumentó dieciséis puntos porcentuales y el valor promedio de compra creció ciento veintidós por ciento. Hay una advertencia: esas cifras no tienen corroboración pública independiente, son de un solo caso sin fuente primaria verificable.", "c": false}, {"t": "El segundo caso es TIM, en Brasil. Usan I.A. generativa multimodal para transcribir el audio de llamadas de soporte, comprender el texto transcrito, clasificar el tipo de problema y resumir la conversación. La I.A. guía al operador humano con la respuesta más adecuada. El beneficio es doble: agiliza la atención en tiempo real y permite extraer aprendizajes de miles de interacciones habladas que antes se perdían en la pileta de llamadas.", "c": false}, {"t": "El tercer caso es Mercedes-Benz. El curso describe una herramienta que analiza en tiempo real los alrededores del automóvil mediante cámaras y responde en lenguaje natural preguntas del conductor. Pero hay una advertencia importante: según la evidencia disponible, la implementación real confirmada es un asistente de voz con ChatGPT integrado, no un copiloto visual como lo presenta el curso. Para tu criterio: al evaluar proveedores, pide siempre la evidencia de la implementación real, no la versión de marketing.", "c": false}, {"t": "El paralelo más cercano a tu AFP es TIM. Tu call center genera miles de llamadas diarias. Una I.A. multimodal que transcribe, clasifica y resume cada llamada en tiempo real, y le sugiere al ejecutivo la respuesta más adecuada, es exactamente el tipo de aplicación que reduce tiempos de atención. Y libera a tu equipo para lo que realmente requiere criterio humano: la conversación de retención, el toque personal, la empatía.", "c": false}, {"t": "Hay un obstáculo importante que el curso señala: estos modelos suelen ser pesados y requieren grandes volúmenes de datos en cada modalidad para su entrenamiento. Sin embargo, la disponibilidad de APIs en la nube facilita su acceso sin necesidad de infraestructura propia. La clave es identificar casos de negocio donde esa visión holística marque la diferencia real. La I.A. multimodal no es para todo. Brilla cuando la tarea involucra varios tipos de datos simultáneamente.", "c": false}, {"t": "Capítulo 3. Edge Computing: la inteligencia va a donde ocurre la acción", "c": true}, {"t": "Hasta aquí, la imagen mental es que la I.A. vive en la nube: en un data center central al que se le envían los datos, procesa y devuelve la respuesta. Pero el curso plantea un problema concreto. ¿Qué pasa cuando se tienen cincuenta tiendas o cientos de sensores a kilómetros de la conexión principal? Enviar constantemente datos crudos a un servidor remoto introduce latencia, que es el retraso en la transmisión, y consume ancho de banda. Además, si la conexión falla, la inteligencia se detiene.", "c": false}, {"t": "Edge Computing propone mover parte de ese cerebro digital a la periferia. Se colocan capacidades de cómputo en dispositivos locales: fábricas, sucursales, antenas. Cada punto tiene suficiente capacidad para gestionar la I.A. necesaria localmente. La I.A. distribuida se refiere al despliegue de algoritmos en múltiples nodos que operan de forma coordinada. El ejemplo del curso es un sensor inteligente que detecta un fallo y acciona una alerta local sin depender de internet.", "c": false}, {"t": "¿Por qué ahora es tan relevante? El curso dice que estamos entrando en una nueva era de sistemas autónomos en los negocios, donde muchas decisiones serán tomadas por máquinas en tiempo real. Cita a Gartner: se estima que un setenta y cinco por ciento de los datos empresariales se crearía y procesaría fuera del data center o la nube centralizada para dos mil veinticinco. Hay una advertencia: el curso formula esa cifra como si se refiriera a directores de I.T. que aumentan presupuestos, pero la predicción original es sobre datos, no sobre presupuestos. Lo importante para ti es la dirección: la inteligencia se está desplazando hacia el borde.", "c": false}, {"t": "Traducido a tu AFP: imagina un quiosco en una sucursal rural con autenticación facial local. El afiliado se verifica en el dispositivo, sin enviar datos biométricos crudos a internet. Si la conexión se cae, la autenticación sigue funcionando. Eso es Edge en acción. Más rápido, más privado y más resistente a caídas de conexión.", "c": false}, {"t": "El contexto latinoamericano hace que esto sea especialmente relevante. Las distancias geográficas y la conectividad son desafíos reales en la región. Monitoreo ambiental en la Amazonía, minas a gran altitud con internet satelital. Edge Computing aporta resiliencia: reduce los saltos de red, mitiga la latencia y los costos de transferencia. Y en el ámbito de la privacidad, los datos sensibles no viajan: se procesan donde se generan.", "c": false}, {"t": "El curso muestra tres familias de aplicaciones. En manufactura, una planta automotriz en México implementó dispositivos Edge en cada sección para detección de anomalías. Si una prensa hidráulica muestra un patrón fuera de rango, el sistema alerta al técnico local y detiene la máquina de forma preventiva, sin esperar a que un servidor remoto procese los datos. En retail, una cadena de supermercados en Brasil usa cámaras en góndolas más módulos Edge para conteo continuo de stock. Solo transmiten datos procesados, como quedan dos leches en el estante cinco. No envían video continuo a la nube.", "c": false}, {"t": "El ejemplo más cercano a tu mundo es el de un banco con quioscos inteligentes en sucursales rurales. Hacen autenticación facial y de voz local, sin enviar datos biométricos crudos a internet, y ofrecen asesoría financiera básica vía un agente conversacional que funciona parcialmente en local. Para tu AFP, el quiosco de sucursal rural es el caso más transferible. Hoy, un afiliado que va a una sucursal remota depende de que la conexión funcione para autenticarse. Con Edge, la verificación se hace en el dispositivo.", "c": false}, {"t": "Sobre los desafíos, el curso reconoce tres: hardware adecuado en el campo, ciberseguridad en miles de puntos distribuidos, y gestión de actualizaciones de modelos de forma remota. Sobre costos, un ejecutivo de Dell aclara que si solo se hacen inferencias en el Edge con casos de uso pequeños, la inversión es muy baja. Incluso dos o tres tarjetas gráficas pueden ser suficientes. La recomendación es un enfoque híbrido: mantener la nube para entrenar modelos grandes y tener visión global, pero desplegar la inferencia en el Edge para la acción local y en tiempo real.", "c": false}, {"t": "Hay una advertencia sobre las cifras de adopción. El curso cita que Edge Computing es la tecnología emergente con mayor nivel de adopción en la región. Pero la fuente original, NTT DATA y HBR Analytics de dos mil veintidós, lo ubica entre las principales, junto con biometría y robótica avanzada. No necesariamente en primer lugar. Es una leve sobreafirmación. La dirección es correcta, pero si alguien te pregunta si es la número uno, la respuesta precisa es que es una de las principales.", "c": false}, {"t": "El Edge no reemplaza a la nube: se combina con ella. La nube entrena y da visión global. El Edge ejecuta rápido, local y privado, donde la acción ocurre. Para tu AFP, eso significa que no tienes que elegir entre uno y otro. La arquitectura híbrida es la que te da lo mejor de ambos mundos.", "c": false}, {"t": "Capítulo 4. Agentes autónomos: colaboradores digitales que toman la iniciativa", "c": true}, {"t": "Hasta ahora, cuando pensábamos en automatización, imaginábamos scripts rígidos o robots de software que seguían reglas predefinidas al pie de la letra. Los agentes autónomos llevan la automatización al siguiente nivel. Son entidades de I.A. que pueden tomar decisiones no triviales por su cuenta, coordinar acciones y aprender de la retroalimentación. El curso lo plantea así: pasamos de automatizar tareas a automatizar procesos y funciones completas de negocio. Es incorporar un nuevo tipo de empleado digital.", "c": false}, {"t": "¿Qué es exactamente un agente autónomo? Es un software impulsado por I.A., a menudo con modelos de lenguaje de grandes dimensiones y algoritmos de planificación, al que se le delega una cierta responsabilidad. A diferencia de un simple bot que responde preguntas, estos agentes pueden encadenar múltiples pasos de razonamiento y acción sin intervención humana en cada paso. Se les llama autónomos porque, una vez configurados con sus objetivos y límites, requieren mínima intervención para ejecutar sus funciones. Pueden colaborar entre sí y con personas, operar continuamente veinticuatro siete y ajustarse según las circunstancias.", "c": false}, {"t": "El curso da un ejemplo ilustrativo: un agente de compras que monitorea niveles de stock, cotiza proveedores, inicia órdenes de compra siguiendo lineamientos de costo y calidad, y negocia precios básicos vía mensajes electrónicos. Se adapta a circunstancias: si un proveedor no responde, busca alternativos; si los precios suben, notifica al gerente. Menciona dos plataformas: AutoGPT, que es experimental, y Microsoft Copilot Studio, que es corporativa.", "c": false}, {"t": "Ahora, la pregunta que probablemente te haces: ¿cómo es esto diferente de un chatbot? Un chatbot te dice que su retiro está en proceso. Un agente autónomo verifica su solicitud, confirma que cumple los requisitos, la autoriza, ejecuta el pago y le notifica, todo sin que un humano toque cada paso. No solo responde: actúa. Toma decisiones no triviales, coordina múltiples acciones en secuencia y aprende de la retroalimentación.", "c": false}, {"t": "En términos de adopción, hay cifras que muestran tracción. Más de cien mil organizaciones usan Copilot Studio para crear agentes empresariales, según Microsoft en octubre de dos mil veinticuatro. Entre ellas están Standard Bank, Thomson Reuters, Virgin Money y Zurich Insurance. KPMG reporta que el doce por ciento de grandes empresas ya tiene agentes en producción, el treinta y siete por ciento en piloto, y más de la mitad explorando activamente. Hay una advertencia: esa cifra de cien mil está desactualizada. A dos mil veinticinco, Microsoft informó más de doscientas treinta mil organizaciones, incluyendo el noventa por ciento de la Fortune 500. Y los pilotos subieron a sesenta y cinco por ciento, mientras el despliegue en producción se mantuvo en alrededor de once por ciento. Lo que esto te dice: los pilotos se aceleran, pero la producción avanza más lento. No te asustes por el ruido.", "c": false}, {"t": "Traducido a tu AFP: un agente de retención proactiva podría monitorear señales de insatisfacción, como baja actividad, consultas frecuentes por teléfono o quejas en redes. Generaría un plan de acción personalizado, redactaría la propuesta de valor, la enviaría y mediría la respuesta. Todo con un supervisor humano revisando las excepciones y las decisiones de mayor impacto. El agente hace el trabajo pesado; tú mantienes la decisión final y el tono.", "c": false}, {"t": "El curso muestra cuatro frentes donde ya actúan. En atención al cliente, un agente de soporte abre un ticket, verifica credenciales, resetea permisos e informa al usuario. En cadena de suministro, un agente vigila ventas y stock, redistribuye inventario y ajusta órdenes de compra. En finanzas, monitorea ingresos, gastos y flujo de caja, y ante desviaciones prepara un resumen para el director financiero. En desarrollo de software, un agente llamado Devin toma código fuente antiguo, intenta compilarlo, corrige errores y actualiza el repositorio, siempre con supervisión final humana.", "c": false}, {"t": "En Latinoamérica, el curso señala que aún estamos en fases exploratorias. Yalo, en México, tiene planes para implementar agentes comerciales en conversaciones de ventas a través de WhatsApp. Grandes bancos evalúan agentes para detección de fraude: bloquear transacciones sospechosas en tiempo real y generar reportes de incidentes automáticamente. Tu AFP probablemente recibirá propuestas similares. La diferencia entre reaccionar y estar preparada está en entender qué puede hacer un agente y dónde pone el límite humano.", "c": false}, {"t": "Para implementarlos sin sorpresas hay varias consideraciones. Primero, hay que entrenar la I.A. dentro del contexto del negocio, incluyendo datos, procesos y reglas, y establecer barandillas de seguridad. Un director de I.A. de Accenture subraya la importancia de gestionar los riesgos de alucinaciones, que es cuando el agente hace inferencias incorrectas que parecen plausibles, y sesgos. En entornos críticos es recomendable comenzar con un humano supervisando las decisiones, al menos hasta ganar confianza. También hay que rediseñar procesos internos: no basta meter un agente en el flujo viejo. Hay que repensar el flujo y definir claramente cuándo debe pasar el control a un humano.", "c": false}, {"t": "La clave es comenzar con pilotos controlados, formar equipos multidisciplinarios con negocio, datos, I.T. y legal, y estar dispuestos a iterar aprendiendo de los errores. Los agentes autónomos no reemplazan a las personas: transforman sus roles. La visión moderna es considerarlos colaboradores, donde humanos e I.A. trabajan estrechamente, cada uno en lo que mejor hace. Para ti como ejecutiva comercial, tu rol no desaparece. Cambia: de hacer las cosas una por una a diseñar las reglas, definir los límites y supervisar resultados.", "c": false}, {"t": "Capítulo 5. Auto M L e I.A. explicable: modelos sin expertos y decisiones que se entienden", "c": true}, {"t": "Auto M L, que significa Machine Learning automatizado, es un conjunto de herramientas que automatizan las etapas del aprendizaje automático: preparación de datos, selección de algoritmos, entrenamiento y optimización. El curso lo resume con una analogía: es como tener un cocinero automático al que le entregas tus ingredientes, que son los datos, y te devuelve el platillo listo, que es un modelo entrenado, sin que tengas que saber la receta exacta. La experiencia del usuario es simple: cargar un conjunto de datos ya etiquetados y presionar un botón de entrenar. La plataforma hace el resto en horas.", "c": false}, {"t": "¿Qué beneficios trae? El primero es ahorro de tiempo. Consensus Corporation, una filial de Target, redujo su tiempo de despliegue de modelos de tres a cuatro semanas a ocho horas. Hay una advertencia: ese caso proviene de DataRobot, que es el propio proveedor, sin auditoría independiente. Aun así, la dirección es clara: empresas que adoptan Auto M L reportan días en lugar de semanas para pasar de datos a modelo funcional. En tu mundo, en vez de esperar semanas a un equipo de ciencia de datos, un analista comercial puede tener un primer modelo en una tarde para validar con criterio de negocio.", "c": false}, {"t": "El segundo beneficio es democratización. El setenta y tres por ciento de las empresas en la región ve la escasez de talento en I.A. como su mayor obstáculo. Hay una advertencia: esa cifra no tiene fuente primaria verificable en el documento del curso. Pero el punto de fondo es válido: Auto M L baja la barrera de entrada. Equipos sin especialización en Machine Learning pueden generar modelos decentes, reduciendo la dependencia de escasos científicos de datos. Trupanion, una aseguradora de mascotas, identificó con antelación más de dos tercios de sus clientes propensos a cancelar. Eso es material de proveedor, pero ilustra el potencial.", "c": false}, {"t": "Piensa en un caso natural para tu AFP: un modelo que predeciría qué afiliados inactivos tienen mayor probabilidad de reactivar su cuenta. Tradicionalmente, eso requeriría un equipo de científicos de datos y varias semanas. Con Auto M L, un analista de tu equipo comercial podría cargar datos de actividad, antigüedad y tipo de cuenta, presionar un botón, y en horas tener un primer modelo para validar con criterio de negocio. Eso no elimina la necesidad de criterio: alguien debe revisar si los resultados tienen sentido antes de actuar.", "c": false}, {"t": "Pero Auto M L no es bala de plata. Si los datos de entrada son de mala calidad, el modelo resultante no será bueno. Es el principio de basura entra, basura sale. Aún se necesita criterio humano para preparar datos, hacer limpieza y selección de variables iniciales, y evaluar si los resultados tienen sentido de negocio. A veces, el modelo ganador puede ser muy complejo o poco explicable, como un conjunto de diez modelos distintos votando. Para casos donde interpretar es importante, conviene restringir qué algoritmos puede probar. Y hay que cuidar los costos: muchos Auto M L funcionan en la nube con cargos por hora de cómputo. Es recomendable empezar con subconjuntos de datos pequeños para calibrar tiempos y luego escalar.", "c": false}, {"t": "Ahora pasemos a la I.A. explicable, que el curso abrevia como Ex A I. La I.A. moderna a veces actúa como una caja negra opaca: redes neuronales profundas toman decisiones cuyo proceso interno es incomprensible para los humanos. La I.A. explicable busca que cada decisión pueda ser interpretada de manera razonable por las personas afectadas: desarrolladores, gerentes, reguladores o los propios clientes. Su premisa es simple: si no lo puedo explicar, no lo puedo confiar.", "c": false}, {"t": "¿Por qué es crucial? El curso lo ilustra con tres escenarios. Un banco deniega un crédito apoyado en un modelo de I.A.: el cliente tiene derecho a saber por qué. Si el banco responde que no sabe, que es lo que escupió el algoritmo, claramente es inaceptable. En salud, si una I.A. sugiere un diagnóstico, el médico querrá ver qué indicadores llevaron a esa conclusión. En publicidad, las empresas vigilan que no haya sesgos indebidos. La falta de explicabilidad dificulta la confianza y la corrección de errores.", "c": false}, {"t": "Hay varias formas de lograr explicabilidad. A priori, eligiendo modelos intrínsecamente más interpretables, como un árbol de decisión en vez de una red neuronal profunda. A posteriori, aplicando técnicas sobre modelos complejos. Una es la importancia de variables: herramientas que calculan cuánto influyó cada entrada en la predicción final. Por ejemplo, la variable meses sin comprar tuvo un peso del cuarenta por ciento en la predicción de que el cliente se iría. Otra son los métodos locales, como LIME y SHAP, que generan una explicación caso a caso: este cliente fue clasificado como de alto riesgo porque su ingreso es bajo y ya tiene tres préstamos, mientras que su historial bueno restó riesgo.", "c": false}, {"t": "El curso presenta un caso práctico muy elocuente. BBVA desarrolló un modelo de I.A. explicable para concesión de crédito que genera automáticamente razones de decisión para entregar a los solicitantes. El mensaje sería algo así: su solicitud fue rechazada porque su nivel de endeudamiento, al setenta y cinco por ciento, excede el máximo permitido, que es cincuenta por ciento, según nuestra política de riesgo. Eso es transparencia real. El afiliado, el regulador o un auditor pueden entender exactamente por qué se tomó esa decisión.", "c": false}, {"t": "Traducido a tu AFP: imagina que un modelo clasifica a un afiliado como alto riesgo de traspaso. El ejecutivo necesita saber por qué. ¿Fue por el saldo bajo, por la antigüedad, por la competencia? Con I.A. explicable, puedes decirle al afiliado o a un auditor exactamente qué variables pesaron en esa decisión. Eso es la diferencia entre una caja negra que genera desconfianza y una caja de cristal que genera confianza. Técnicamente no es tan difícil implementarlo. El mayor reto suele ser cultural: recordar siempre que un modelo de I.A. en producción debe ser auditable y entendible por alguien competente.", "c": false}, {"t": "Capítulo 6. Regulación, confianza y tu proyección a dos mil veintiocho", "c": true}, {"t": "La regulación de I.A. avanza a un ritmo que pocas veces anticipamos. En Europa, la Unión Europea ya tiene su Ley de I.A. vigente desde dos mil veinticuatro. El curso la presenta como próxima, pero en realidad ya está en vigor. Un reglamento complementario de dos mil veintiséis pospuso las obligaciones más estrictas: los sistemas de alto riesgo pasan al diciembre de dos mil veintisiete y los integrados en productos al agosto de dos mil veintiocho. Se pospuso el plazo, no se eliminó la obligación. La dirección es clara: la explicabilidad será exigida, solo se definió cuándo exactamente.", "c": false}, {"t": "En Latinoamérica, el estado es algo más avanzado de lo que el curso sugiere con la palabra discutiendo. En Brasil, el proyecto de ley ya fue aprobado por el Senado a fines de dos mil veinticuatro y está en la Cámara de Diputados desde marzo de dos mil veinticinco. En Chile, el proyecto de ley de I.A., inspirado en el enfoque de riesgo europeo, fue aprobado en la Cámara en octubre de dos mil veinticinco pero sigue en el Senado. Tampoco es ley todavía. El punto del curso es que la regulación viene, aunque el estado legislativo exacto varía de país a país.", "c": false}, {"t": "Aquí entra la I.A. explicable como pieza que sostiene todo lo demás. El curso lo resume con una frase directa: la I.A. explicable es el complemento indispensable de todas las demás tendencias que vimos. Sin explicabilidad, la multimodalidad, el Edge, los agentes y el Auto M L son potentes pero opacos. Con I.A. explicable, cada decisión puede ser auditada por un desarrollador, un gerente, un regulador o el propio cliente. La confianza no es opcional: una encuesta global muestra que la falta de transparencia es uno de los principales frenos a la adopción de I.A. Al contrario, ser transparentes la impulsa.", "c": false}, {"t": "La buena práctica que propone el curso es una pregunta concreta: cada vez que se despliegue un modelo, pregúntate qué le diríamos a un cliente o a un auditor que nos cuestione esta predicción. Si tienes una respuesta clara, vas por buen camino. Prepararse para esto no es un trámite burocrático: es adoptar una actitud proactiva que además mejora la calidad de los modelos. Imagina que un afiliado te pregunta por teléfono por qué le recomendaron migrar a un fondo más conservador si su perfil es agresivo. Con I.A. explicable podrías decirle que el modelo consideró su edad, su horizonte de retiro y la volatilidad reciente de su fondo actual. Eso es confianza construida con transparencia.", "c": false}, {"t": "El cierre práctico de la unidad es un ejercicio: proyectarte a dos mil veintiocho. Debes redactar una proyección personal y profesional sobre el uso de I.A. en tu campo laboral. Elegir al menos una de las cinco tecnologías y responder cuatro preguntas: cómo se implementará, cómo cambiarán los procesos y la experiencia del cliente, cuáles son los riesgos y cómo colaborarías con otros. Para tu AFP, piensa en un escenario concreto: un agente autónomo que gestiona la retención de afiliados con riesgo de traspaso, combinado con Auto M L para predecir quién se va y con I.A. explicable para explicar cada recomendación al ejecutivo. No necesitas que sea perfecto. Necesitas que sea plausible.", "c": false}, {"t": "Hay una imagen que resuma todo. Imagina tu campaña de retención del próximo trimestre con las cinco trabajando juntas. Auto M L predice qué afiliados tienen mayor riesgo de traspaso. El agente autónomo redacta la propuesta personalizada y coordina el envío. El Edge procesa la llamada en tiempo real cuando el afiliado llama para preguntar. La multimodal entiende su tono, su documento y su contexto. Y la I.A. explicable te da las razones exactas para que tú respondas con seguridad. Esa es la unidad completa funcionando como sistema. No necesitas implementarlo todo mañana. Necesitas saber que el mapa existe y que puedes ubicarte en él.", "c": false}, {"t": "La prospectiva no es futurismo. Es decidir hoy, con información y con criterio, qué camino te deja mejor preparada para cuando estas tecnologías dejen de ser novedad y se conviertan en estándar del sector. Escribir tu proyección te obliga a convertir la información en criterio propio. Y eso es exactamente lo que esta unidad te está pidiendo.", "c": false}, {"t": "Jeanette, llegamos al final de esta unidad. No necesitas memorizar las cinco tecnologías ni sus detalles técnicos. Lo que necesitas es una brújula: criterio para tomar decisiones comerciales cuando estas tecnologías aparezcan en tu conversación de negocio, en un tablero, en una reunión con tu director financiero o en una conversación con un regulador. Y eso, con este audio en la mochila, ya lo tienes. Nos escuchamos en la próxima unidad.", "c": false}];
const reader = document.getElementById('reader');
const pfill = document.getElementById('pfill');
const playBtn = document.getElementById('play');

/* ---- SANEADOR: lo que se OYE se limpia; lo que se VE queda intacto ----
   Garantiza que ningun simbolo (comillas, parentesis, rayas, %) se lea en
   voz alta, aunque se cuele en el guion. */
function hablar(t){
  return String(t)
    .replace(/[“”„‟«»"‘’‹›']/g,'') // comillas de todo tipo
    .replace(/[()\[\]{}]/g,', ')            // parentesis/corchetes -> pausa, no la palabra
    .replace(/[—–]/g,', ')        // raya y guion largo -> coma
    .replace(/%/g,' por ciento')            // red de seguridad
    .replace(/&/g,' y ')
    .replace(/\*/g,'')                       // asteriscos sueltos (markdown colado)
    .replace(/\s*([,;])(\s*[,;])+/g,'$1')    // colapsa comas/; repetidas
    .replace(/\s+([,;.!?…])/g,'$1')          // quita el espacio ANTES de la puntuacion
    .replace(/\s+/g,' ')
    .trim();
}

// render (en pantalla se muestra el texto ORIGINAL, con o sin simbolos)
SEGS.forEach((s,i)=>{
  const d = document.createElement('p');
  d.className = 'seg' + (s.c ? ' chap':'');
  d.textContent = s.t;
  d.dataset.i = i;
  d.onclick = ()=>{ speakFrom(i); };
  reader.appendChild(d);
});
const nodes = [...document.querySelectorAll('.seg')];

let idx = 0, playing = false, rate = 1;
const synth = window.speechSynthesis;
let voices = [], chosenVoice = null;

/* ---- Seleccion de la MEJOR voz disponible ---- */
function scoreVoice(v){
  let s = 0;
  const n = (v.name||'').toLowerCase();
  const l = (v.lang||'').toLowerCase();
  if(l.startsWith('es')) s += 100;
  if(/es-mx|es-us|es-419/.test(l)) s += 20;             // latino neutro
  if(/enhanced|premium|neural|siri|natural/.test(n)) s += 40; // voces de calidad
  if(v.localService) s += 10;                            // instalada / offline
  if(/compact|comp\b|eloquence/.test(n)) s -= 30;        // voz compacta = robotica
  if(/m[óo]nica|paulina|juan|jorge|marisol|luciana|diego|carlos|angelica/.test(n)) s += 8; // nombres buenos (Apple)
  return s;
}
function loadVoices(){
  const all = synth.getVoices();
  voices = all.filter(v=>v.lang && v.lang.toLowerCase().startsWith('es'));
  if(!voices.length) voices = all.slice();
  voices = voices.slice().sort((a,b)=>scoreVoice(b)-scoreVoice(a));
  const sel = document.getElementById('voice');
  sel.innerHTML='';
  voices.forEach((v,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=v.name.replace(/Microsoft |Google /,'')+' ('+v.lang+')';
    sel.appendChild(o);
  });
  chosenVoice = voices[0] || null;   // la mejor por puntaje
  sel.value = 0;
  sel.onchange=()=>{ chosenVoice=voices[sel.value]; if(playing){ synth.cancel(); speakFrom(idx);} };
}
loadVoices();
if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=loadVoices;

/* ---- Retomar donde quedo (localStorage, por archivo) ---- */
const POSKEY = 'alib:' + location.pathname;
function savePos(i){ try{ localStorage.setItem(POSKEY, String(i)); }catch(e){} }
function clearPos(){ try{ localStorage.removeItem(POSKEY); }catch(e){} }
function loadPos(){
  try{
    const v = parseInt(localStorage.getItem(POSKEY),10);
    if(isNaN(v)) return 0;
    return Math.min(Math.max(v,0), SEGS.length-1);
  }catch(e){ return 0; }
}

function highlight(i){
  nodes.forEach((n,k)=>{
    n.classList.toggle('active', k===i);
    n.classList.toggle('done', k<i);
  });
  pfill.style.width = ((i)/(SEGS.length-1)*100).toFixed(1)+'%';
  const el = nodes[i];
  const r = el.getBoundingClientRect();
  if(r.top < 90 || r.bottom > window.innerHeight-210){
    el.scrollIntoView({behavior:'smooth', block:'center'});
  }
}

function speakSeg(i){
  if(i>=SEGS.length){ stop(); pfill.style.width='100%'; clearPos(); return; }
  idx=i; highlight(i); savePos(i);
  const texto = hablar(SEGS[i].t);
  if(!texto){ if(playing) speakSeg(i+1); return; }   // segmento sin nada que decir
  const u = new SpeechSynthesisUtterance(texto);
  if(chosenVoice) u.voice=chosenVoice;
  u.lang = chosenVoice ? chosenVoice.lang : 'es-ES';
  u.rate = rate; u.pitch = 1;
  u.onend = ()=>{
    if(!playing) return;
    const next = i+1;
    // respiracion real antes de entrar a un capitulo nuevo
    const pausa = (next<SEGS.length && SEGS[next].c) ? 750 : 0;
    if(pausa){ setTimeout(()=>{ if(playing) speakSeg(next); }, pausa); }
    else speakSeg(next);
  };
  synth.speak(u);
}
function speakFrom(i){ synth.cancel(); playing=true; playBtn.innerHTML='&#10074;&#10074;'; speakSeg(i); }
function stop(){ playing=false; synth.cancel(); playBtn.innerHTML='&#9658;'; }

playBtn.onclick=()=>{
  if(playing){ stop(); }
  else { speakFrom(idx); }
};
document.getElementById('next').onclick=()=>{ speakFrom(Math.min(idx+1,SEGS.length-1)); };
document.getElementById('prev').onclick=()=>{ speakFrom(Math.max(idx-1,0)); };

// speed
document.querySelectorAll('.spd button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.spd button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); rate=parseFloat(b.dataset.r);
    if(playing){ synth.cancel(); speakSeg(idx); }
  };
});

// chapters
const chapList=document.getElementById('chapList');
SEGS.forEach((s,i)=>{
  if(s.c){
    const d=document.createElement('div');
    d.className='chap-item';
    d.innerHTML='<span class="cn">&#9834;</span>'+s.t;
    d.onclick=()=>{ closeSheet(); speakFrom(i); };
    chapList.appendChild(d);
  }
});
const sheet=document.getElementById('sheet');
document.getElementById('chapBtn').onclick=()=>sheet.classList.add('open');
sheet.onclick=(e)=>{ if(e.target===sheet) closeSheet(); };
function closeSheet(){ sheet.classList.remove('open'); }

/* ---- Toast breve ---- */
function showToast(msg){
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),450); }, 2600);
}

/* ---- Arranque: retoma donde quedo, sin reproducir hasta que de play ---- */
const startAt = loadPos();
idx = startAt;
highlight(startAt);
if(startAt>0){
  showToast('▶ Retomando donde quedaste');
  const el = nodes[startAt];
  if(el) el.scrollIntoView({block:'center'});
}
</script>
</body>
</html>
